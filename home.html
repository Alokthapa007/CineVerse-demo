<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVerse Home</title>
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <header class="site-header" data-navbar>
    <div class="brand">CineVerse</div>

    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-link" href="home.html">Homepage</a>
      <a class="nav-link" href="recommendation.html">Recommendation</a>
      <a class="nav-link" href="profile.html">Profile</a>
    </nav>

    <button id="logoutBtn" class="btn btn-danger" type="button">Logout</button>
  </header>

  <main class="container">
    <section class="movies" aria-label="Movie collections">
      <div id="homeMovies" class="homepage-sections" aria-live="polite"></div>
    </section>
  </main>

  <footer class="site-footer">© 2026 CineVerse • Discover your next favorite movie</footer>

  <script src="js/global.js"></script>
  <script>
    const homeMovies = document.getElementById('homeMovies');
    const movieCacheKey = 'cineverseMovieCache';
    const movieCacheDuration = 1000 * 60 * 60 * 12;
    const displayedMovieIds = new Set();

    function readMovieCache() {
      try {
        const raw = localStorage.getItem(movieCacheKey);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        return {};
      }
    }

    function writeMovieCache(cache) {
      localStorage.setItem(movieCacheKey, JSON.stringify(cache));
    }

    async function fetchMoviesWithCache(query) {
      const normalizedQuery = (query || '').trim();
      const cache = readMovieCache();
      const cacheKey = normalizedQuery.toLowerCase() + '|1';
      const cached = cache[cacheKey];

      if (cached && Date.now() - cached.time < movieCacheDuration) {
        return cached.data;
      }

      try {
        const result = await window.CineVerse.searchMovies(normalizedQuery);
        const adapted = {
          Search: result.Search || [],
          totalResults: Number(result.totalResults || 0),
          error: result.error || null
        };

        cache[cacheKey] = { time: Date.now(), data: adapted };
        writeMovieCache(cache);
        return adapted;
      } catch (error) {
        if (cached) return cached.data;
        return { Search: [], totalResults: 0, error: 'Request limit reached. Please wait a moment and refresh.' };
      }
    }

    function addCardClickBehavior(card, movie) {
      card.addEventListener('click', function (event) {
        if (event.target.closest('button')) return;
        if (movie && movie.imdbID) {
          window.location.href = 'movie-details.html?id=' + encodeURIComponent(movie.imdbID);
        }
      });
    }

    async function fetchSectionMovies(section) {
      if (section.anime) {
        return (await window.CineVerse.fetchAnimeMovies(1)).slice(0, section.limit);
      }

      const seen = new Map();
      const queries = Array.isArray(section.queries) ? section.queries.slice(0, 2) : [section.query];

      for (const query of queries) {
        if (!query) continue;
        try {
          const result = await fetchMoviesWithCache(query);
          if (result && result.error) {
            continue;
          }

          const items = Array.isArray(result && result.Search) ? result.Search : [];
          items.forEach(function (movie) {
            if (!window.CineVerse.hasMoviePoster(movie) || !movie.imdbID || seen.has(movie.imdbID)) return;
            seen.set(movie.imdbID, movie);
          });
        } catch (error) {
          console.warn('Section fetch failed for:', query, error);
        }
      }

      let candidates = Array.from(seen.values()).filter(function (movie) {
        return !displayedMovieIds.has(movie.imdbID);
      });
      if (section.sort === 'rating') {
        candidates.sort(function (a, b) {
          return Number(b.imdbRating || 0) - Number(a.imdbRating || 0);
        });
      } else {
        for (let index = candidates.length - 1; index > 0; index--) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [candidates[index], candidates[randomIndex]] = [candidates[randomIndex], candidates[index]];
        }
      }

      let movies = candidates.slice(0, section.limit);

      if (section.genre) {
        const details = await Promise.all(movies.map(async function (movie) {
          try {
            return await window.CineVerse.fetchMovieDetails(movie.imdbID);
          } catch (error) {
            return null;
          }
        }));

        movies = details.filter(function (movie) {
          if (!movie || !movie.Genre) return false;
          return movie.Genre.toLowerCase().includes(section.genre.toLowerCase());
        }).slice(0, section.limit);
      }

      if (section.sort === 'rating') {
        const details = await Promise.all(movies.map(async function (movie) {
          try {
            return await window.CineVerse.fetchMovieDetails(movie.imdbID);
          } catch (error) {
            return movie;
          }
        }));

        movies = details
          .filter(Boolean)
          .sort(function (a, b) {
            const ra = Number(a.imdbRating || 0);
            const rb = Number(b.imdbRating || 0);
            return rb - ra;
          })
          .slice(0, section.limit);
      }

      movies.forEach(function (movie) {
        if (movie && movie.imdbID) displayedMovieIds.add(movie.imdbID);
      });

      return movies;
    }

    function createSectionMarkup(section, movies) {
      const wrapper = document.createElement('section');
      wrapper.className = 'movie-section';

      const header = document.createElement('div');
      header.className = 'section-header';

      const title = document.createElement('h2');
      title.textContent = section.title;

      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = movies.length ? 'Live' : 'Empty';

      header.appendChild(title);
      header.appendChild(badge);
      wrapper.appendChild(header);

      const rowShell = document.createElement('div');
      rowShell.className = 'movie-row-shell';

      const row = document.createElement('div');
      row.className = 'movie-row';

      if (!movies.length) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = 'No movies available for this section right now.';
        row.appendChild(empty);
      } else {
        movies.forEach(function (movie) {
          const card = window.CineVerse.createMovieCard(movie);
          addCardClickBehavior(card, movie);
          row.appendChild(card);
        });
      }

      if (movies.length) {
        const prevBtn = document.createElement('button');
        prevBtn.type = 'button';
        prevBtn.className = 'scroll-button scroll-button-left';
        prevBtn.setAttribute('aria-label', 'Scroll left');
        prevBtn.textContent = '‹';
        prevBtn.addEventListener('click', function () {
          row.scrollBy({ left: -260, behavior: 'smooth' });
        });

        const nextBtn = document.createElement('button');
        nextBtn.type = 'button';
        nextBtn.className = 'scroll-button scroll-button-right';
        nextBtn.setAttribute('aria-label', 'Scroll right');
        nextBtn.textContent = '›';
        nextBtn.addEventListener('click', function () {
          row.scrollBy({ left: 260, behavior: 'smooth' });
        });

        rowShell.appendChild(prevBtn);
        rowShell.appendChild(row);
        rowShell.appendChild(nextBtn);
      } else {
        rowShell.appendChild(row);
      }

      wrapper.appendChild(rowShell);
      return wrapper;
    }

    async function renderMovieSection(section) {
      const sectionEl = document.createElement('div');
      sectionEl.className = 'movie-section-wrap';
      homeMovies.appendChild(sectionEl);

      const loading = document.createElement('div');
      loading.className = 'section-loading';
      loading.textContent = 'Loading ' + section.title + '...';
      sectionEl.appendChild(loading);

      try {
        const movies = await fetchSectionMovies(section);
        if (movies.length < 5) {
          sectionEl.remove();
          return;
        }

        sectionEl.innerHTML = '';
        sectionEl.appendChild(createSectionMarkup(section, movies));
      } catch (error) {
        console.error('Failed to load section:', section.title, error);
        sectionEl.remove();
      }
    }

    async function loadMovieHomepage() {
      homeMovies.innerHTML = '';
      const sectionDefinitions = [
        { title: 'Trending Now', queries: ['batman', 'avengers'], limit: 10 },
        { title: 'Popular Movies', queries: ['top gun', 'matrix'], limit: 10 },
        { title: 'Top Rated', queries: ['inception', 'the dark knight'], limit: 10, sort: 'rating' },
        { title: 'Now Playing', queries: ['new release', 'latest movie'], limit: 10 },
        { title: 'Upcoming Movies', queries: ['coming soon', 'premiere'], limit: 10 },
        { title: 'Action Movies', queries: ['john wick', 'action movie'], limit: 10, genre: 'Action' },
        { title: 'Comedy Movies', queries: ['ghostbusters', 'comedy movie'], limit: 10, genre: 'Comedy' },
        { title: 'Horror Movies', queries: ['scream', 'horror movie'], limit: 10, genre: 'Horror' },
        { title: 'Sci-Fi Movies', queries: ['matrix', 'dune'], limit: 10, genre: 'Sci-Fi' },
        { title: 'Anime Movies', limit: 10, anime: true },
        { title: 'Romance Movies', queries: ['the notebook', 'romance movie'], limit: 10, genre: 'Romance' }
      ];

      for (const section of sectionDefinitions) {
        await renderMovieSection(section);
      }
    }

    loadMovieHomepage();
  </script>
</body>
</html>
