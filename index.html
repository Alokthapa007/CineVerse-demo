<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>
<link rel="stylesheet" href="css/global.css">
</head>
<body class="auth-page">
<div class="auth-shell">
  <div class="auth-brand" role="img" aria-label="CineVerse">
    <img src="assets/cineverse-logo.svg" alt="">
    <span>CineVerse</span>
  </div>

  <main class="auth-card">
    <header>
      <h1 class="auth-title">Login</h1>
    </header>

    <form id="loginForm" class="auth-form" action="#" method="post">
      <fieldset>
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" placeholder="Enter your username or email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
      </fieldset>
    </form>

    <div id="loginMessage" class="auth-message" aria-live="polite"></div>

    <div class="auth-footer">
      <a class="auth-link" href="reset-password.html">Forgot Password?</a> | <a class="auth-link" href="signup.html">Sign Up</a>
    </div>
  </main>

  <aside class="demo-account" aria-labelledby="demoAccountTitle">
    <h2 id="demoAccountTitle">Demo account</h2>
    <p>Use these credentials to explore CineVerse:</p>
    <p><strong>Username:</strong> <code>demo</code></p>
    <p><strong>Password:</strong> <code>demo123</code></p>
  </aside>
</div>
<script src="js/global.js"></script>
<script>
  const loginForm = document.getElementById('loginForm');
  const loginMessage = document.getElementById('loginMessage');

  loginForm.addEventListener('submit', function (event) {
    event.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (username.length < 3) {
      loginMessage.textContent = 'Username must be at least 3 characters.';
      loginMessage.className = 'auth-message error';
      return;
    }

    if (password.length < 6) {
      loginMessage.textContent = 'Password must be at least 6 characters.';
      loginMessage.className = 'auth-message error';
      return;
    }

    const savedUsers = localStorage.getItem('cineverseUser') || '';
    const users = savedUsers ? savedUsers.split(';') : [];

    let validUser = false;
    let loggedInUsername = '';

    for (let i = 0; i < users.length; i++) {
      const userData = users[i].split('|');
      const savedUsername = (userData[0] || '').trim();
      const savedPassword = userData[1] || '';
      const savedEmail = (userData[2] || '').trim();

      if (savedPassword === password &&
          (savedUsername.toLowerCase() === username.toLowerCase() || savedEmail.toLowerCase() === username.toLowerCase())) {
        validUser = true;
        loggedInUsername = savedUsername;
        break;
      }
    }

    if (!validUser && username.toLowerCase() === 'admin' && password === 'admin123') {
      validUser = true;
      loggedInUsername = 'admin';
    }

    if (!validUser && username.toLowerCase() === 'demo' && password === 'demo123') {
      validUser = true;
      loggedInUsername = 'demo';
    }

    if (validUser) {
      loginMessage.textContent = 'Login successful! Redirecting...';
      loginMessage.className = 'auth-message success';
      localStorage.setItem('loggedInUser', loggedInUsername || username);

      setTimeout(function () {
        window.location.href = 'home.html';
      }, 500);
    } else {
      loginMessage.textContent = 'Invalid username or password.';
      loginMessage.className = 'auth-message error';
    }
  });
</script>

</body>
</html>
