<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineVerse Recommendations</title>
  <link rel="stylesheet" href="css/global.css">
</head>
<body>
  <header class="site-header" data-navbar>
    <div class="brand">CineVerse</div>
    <nav class="site-nav" aria-label="Main navigation">
      <a class="nav-link" href="home.html">Homepage</a>
      <a class="nav-link" href="recommendation.html">Recommendation</a>
      <a class="nav-link" href="profile.html">Profile</a>
    </nav>
    <button id="logoutBtn" class="btn btn-danger" type="button">Logout</button>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Movie Recommendations</h1>
      <p>Discover a curated mix of films based on your favorite genres, from action-packed blockbusters to emotional dramas and thrilling sci-fi adventures.</p>
      <nav class="genres" aria-label="Genre filter" id="genreButtons">
        <button class="genre-btn active" data-genre="all">All</button>
        <button class="genre-btn" data-genre="action">Action</button>
        <button class="genre-btn" data-genre="comedy">Comedy</button>
        <button class="genre-btn" data-genre="drama">Drama</button>
        <button class="genre-btn" data-genre="horror">Horror</button>
        <button class="genre-btn" data-genre="romance">Romance</button>
        <button class="genre-btn" data-genre="thriller">Thriller</button>
        <button class="genre-btn" data-genre="sci-fi">Sci-Fi</button>
        <button class="genre-btn" data-genre="adventure">Adventure</button>
        <button class="genre-btn" data-genre="animation">Animation</button>
        <button class="genre-btn" data-genre="crime">Crime</button>
      </nav>
    </section>

    <p class="status" id="statusText" aria-live="polite">Showing all recommended movies.</p>
    <section class="recommendations" id="recommendationList" aria-label="Recommended movies"></section>
  </main>

  <script src="js/global.js"></script>
  <script>
    var genreButtons = document.querySelectorAll('.genre-btn');
    var recommendationList = document.getElementById('recommendationList');
    var statusText = document.getElementById('statusText');
    var logoutBtn = document.getElementById('logoutBtn');

    var genreKeywords = {
      'all': ['action', 'comedy', 'drama'],
      'action': ['action', 'avengers', 'john wick'],
      'comedy': ['comedy', 'ghostbusters', 'superbad'],
      'drama': ['drama', 'the godfather', '1917'],
      'horror': ['horror', 'scream', 'conjuring'],
      'romance': ['romance', 'the notebook', 'la la land'],
      'thriller': ['thriller', 'se7en', 'gone girl'],
      'sci-fi': ['sci-fi', 'dune', 'matrix'],
      'adventure': ['adventure', 'jurassic', 'indiana jones'],
      'animation': ['animation', 'toy story', 'inside out'],
      'crime': ['crime', 'heat', 'goodfellas']
    };

    function setStatus(text, state) {
      statusText.textContent = text || '';
      const classes = ['field-status'];
      if (state === 'success') classes.push('success');
      if (state === 'error') classes.push('error');
      statusText.className = classes.join(' ');
    }

    function buildRecCard(data) {
      var movie = window.CineVerse.normalizeMovie ? window.CineVerse.normalizeMovie(data) : data;
      var card = document.createElement('article');
      card.className = 'recommendation-card';

      var figure = document.createElement('figure');
      var image = document.createElement('img');
      image.src = (movie.Poster && movie.Poster !== 'N/A') ? movie.Poster : 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png';
      image.alt = movie.Title || 'Movie poster';
      image.onerror = function () {
        this.src = 'https://cdn.pixabay.com/photo/2015/10/05/22/37/blank-profile-picture-973460_1280.png';
      };
      figure.appendChild(image);

      var content = document.createElement('div');
      content.className = 'card-content';

      var title = document.createElement('h2');
      title.className = 'card-title';
      title.textContent = movie.Title || 'Unknown';

      var meta = document.createElement('p');
      meta.className = 'card-meta';
      meta.textContent = (movie.Genre ? movie.Genre.split(',')[0].toUpperCase() : 'MOVIE');

      var year = document.createElement('time');
      year.setAttribute('datetime', (movie.Year || '').toString());
      year.textContent = ' ' + (movie.Year || '');
      meta.appendChild(year);

      var rating = document.createElement('p');
      rating.className = 'card-rating';
      rating.textContent = movie.imdbRating && movie.imdbRating !== 'N/A' ? 'IMDb: ' + movie.imdbRating : 'TMDB: ' + (movie.vote_average ? Number(movie.vote_average).toFixed(1) : 'N/A');

      card.addEventListener('click', function () {
        var movieId = movie.imdbID || movie.id;
        if (movieId) {
          window.location.href = 'movie-details.html?id=' + encodeURIComponent(movieId);
        }
      });

      content.appendChild(title);
      content.appendChild(meta);
      content.appendChild(rating);
      card.appendChild(figure);
      card.appendChild(content);
      return card;
    }

    async function fetchSearch(keyword) {
      try {
        var result = await window.CineVerse.searchMovies(keyword);
        return result.Search || [];
      } catch (error) {
        console.error(error);
        return [];
      }
    }

    async function fetchDetails(movieId) {
      try {
        return await window.CineVerse.fetchMovieDetails(movieId);
      } catch (error) {
        console.error(error);
        return null;
      }
    }

    async function loadGenreMovies(genreKey) {
      recommendationList.innerHTML = '';
      var key = genreKey || 'action';
      setStatus('Loading ' + key + ' movies...');

      var keywords = (genreKeywords[key] || [key]).slice(0, 2);
      var list = [];

      for (var i = 0; i < keywords.length; i++) {
        var searchResults = await fetchSearch(keywords[i]);
        list = list.concat(searchResults);
        if (list.length >= 12) break;
      }

      if (!list.length) {
        setStatus('No recommendations found for ' + key + '.', 'error');
        recommendationList.innerHTML = '<p class="empty-state">No recommendations found for that genre.</p>';
        return;
      }

      var unique = [];
      var seen = new Set();
      list.forEach(function (movie) {
        var id = movie && (movie.id || movie.imdbID);
        if (!id || seen.has(id)) return;
        seen.add(id);
        unique.push(movie);
      });

      var movies = unique.slice(0, 12);
      var shown = 0;

      movies.forEach(function (movie) {
        if (!movie) return;
        var item = window.CineVerse.normalizeMovie(movie);
        if (!item) return;
        if (key !== 'all' && item.Genre && item.Genre.toLowerCase().indexOf(key.toLowerCase()) === -1) {
          return;
        }
        recommendationList.appendChild(buildRecCard(item));
        shown++;
      });

      if (shown === 0) {
        recommendationList.innerHTML = '<p class="empty-state">No recommendations found for that genre.</p>';
        setStatus('No recommendations found for ' + key + '.', 'error');
      } else {
        setStatus('Showing ' + shown + ' ' + key + ' recommendations.', 'success');
      }
    }

    function selectGenre(event) {
      var button = event.target;
      var selectedGenre = button.getAttribute('data-genre');

      for (var j = 0; j < genreButtons.length; j++) {
        var btn = genreButtons[j];
        btn.classList.toggle('active', btn.getAttribute('data-genre') === selectedGenre);
      }

      if (selectedGenre === 'all') {
        loadGenreMovies('action');
      } else {
        loadGenreMovies(selectedGenre);
      }
    }

    for (var k = 0; k < genreButtons.length; k++) {
      genreButtons[k].addEventListener('click', selectGenre);
    }

    logoutBtn.addEventListener('click', function () {
      localStorage.removeItem('loggedInUser');
      window.location.href = 'Login.html';
    });

    loadGenreMovies('action');
  </script>
</body>
</html>
