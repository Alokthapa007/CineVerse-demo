<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <style>
    /* Dark theme background and overall page layout for the reset-password screen. */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0d1117, #121c26 40%, #0b1220);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      color: #e6edf3;
    }

    /* Brand label styling for the CinVerse identity mark placed at the top-left. */
    .brand {
      position: absolute;
      top: 18px;
      left: 20px;
      background: rgba(22, 27, 34, 0.9);
      color: #f0f6fc;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }

    /* Main card container for the reset password form in the dark theme. */
    main {
      background-color: #161b22;
      padding: 30px;
      border: 1px solid #30363d;
      border-radius: 18px;
      width: 350px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    /* Page title styling for the reset-password screen. */
    header h1 {
      text-align: center;
      font-size: 22px;
      margin-bottom: 20px;
      color: #f0f6fc;
    }

    /* Remove default fieldset border to keep the form clean. */
    fieldset {
      border: none;
      padding: 0;
      margin: 0;
    }

    /* Labels used for form fields in the reset flow. */
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #c9d1d9;
    }

    /* Styling for email and password inputs in the reset form. */
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 15px;
      border: 1px solid #30363d;
      border-radius: 10px;
      font-size: 14px;
      box-sizing: border-box;
      background-color: #0d1117;
      color: #e6edf3;
    }

    /* Placeholder colors for the password and email fields. */
    input::placeholder {
      color: #8b949e;
    }

    /* Reset button styling and hover appearance. */
    button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(180deg, #238636, #196c2f);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: linear-gradient(180deg, #2ea043, #238636);
    }

    /* Validation and success message styling. */
    .message {
      margin-top: 12px;
      font-size: 13px;
      min-height: 18px;
      text-align: center;
      color: #d93025;
    }

    /* Footer link styling for returning to login. */
    footer {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
    }

    footer a {
      color: #8ec9ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- Top-left CinVerse branding for the reset-password page. -->
  <div class="brand">CinVerse</div>

  <!-- Main reset-password form container. -->
  <main>
    <header>
      <!-- Page heading for the password reset flow. -->
      <h1>Reset Password</h1>
    </header>

    <!-- This form collects the email and the new password for the reset-password flow. -->
    <form id="resetForm" action="#" method="post">
      <fieldset>
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" name="resetEmail" placeholder="Enter your email" required>

        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="Enter a new password" required autocomplete="new-password">

        <label for="confirmNewPassword">Confirm New Password</label>
        <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter your new password" required>

        <button type="submit">Reset Password</button>
      </fieldset>
    </form>

    <!-- This placeholder element displays validation results and success messages. -->
    <div id="resetMessage" class="message" aria-live="polite"></div>

    <!-- Link back to the login page. -->
    <footer>
      <a href="Login.html">Back to Login</a>
    </footer>
  </main>

  <script>
    // Get the reset form and message box for validation and user feedback.
    const resetForm = document.getElementById('resetForm');
    const resetMessage = document.getElementById('resetMessage');

    // Validate the reset form before accepting the new password.
    resetForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const email = document.getElementById('resetEmail').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      // Check for a valid email format.
      if (!email || !email.includes('@')) {
        resetMessage.textContent = 'Please enter a valid email address.';
        resetMessage.style.color = '#d93025';
        return;
      }

      // Check if the new password is long enough.
      if (newPassword.length < 6) {
        resetMessage.textContent = 'New password must be at least 6 characters.';
        resetMessage.style.color = '#d93025';
        return;
      }

      // Check if both password fields match.
      if (newPassword !== confirmNewPassword) {
        resetMessage.textContent = 'Passwords do not match.';
        resetMessage.style.color = '#d93025';
        return;
      }

      // Show success feedback when validation passes.
      resetMessage.textContent = 'Password reset successful! Local validation passed.';
      resetMessage.style.color = '#2e7d32';
      resetForm.reset();
    });
  </script>
</body>
</html>
