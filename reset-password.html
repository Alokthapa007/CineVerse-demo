<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  <link rel="stylesheet" href="css/global.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-brand" role="img" aria-label="CineVerse brand">
      <img src="assets/cineverse-logo.svg" alt="">
      <span>CineVerse</span>
    </div>

    <main class="auth-card">
      <section class="reset-section" aria-labelledby="resetTitle">
        <header>
          <h1 id="resetTitle" class="auth-title">Reset Password</h1>
        </header>

        <form id="resetForm" class="auth-form" action="#" method="post">
          <fieldset>
            <label for="resetEmail">Email</label>
            <input type="email" id="resetEmail" name="resetEmail" placeholder="Enter your email" required>

            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" name="newPassword" placeholder="Enter a new password" required autocomplete="new-password">

            <label for="confirmNewPassword">Confirm New Password</label>
            <input type="password" id="confirmNewPassword" name="confirmNewPassword" placeholder="Re-enter your new password" required>

            <button type="submit">Reset Password</button>
          </fieldset>
        </form>

        <div id="resetMessage" class="auth-message" aria-live="polite"></div>

        <div class="auth-footer">
          <a class="auth-link" href="index.html">Back to Login</a>
        </div>
      </section>
    </main>
  </div>

  <script src="js/global.js"></script>
  <script>
    const resetForm = document.getElementById('resetForm');
    const resetMessage = document.getElementById('resetMessage');

    function getSavedUsers() {
      const saved = localStorage.getItem('cineverseUser') || '';
      return saved ? saved.split(';') : [];
    }

    function saveUsers(users) {
      localStorage.setItem('cineverseUser', users.join(';'));
    }

    resetForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const email = document.getElementById('resetEmail').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirmNewPassword = document.getElementById('confirmNewPassword').value;

      if (!email || !email.includes('@')) {
        resetMessage.textContent = 'Please enter a valid email address.';
        resetMessage.className = 'auth-message error';
        return;
      }

      if (newPassword.length < 6) {
        resetMessage.textContent = 'New password must be at least 6 characters.';
        resetMessage.className = 'auth-message error';
        return;
      }

      if (newPassword !== confirmNewPassword) {
        resetMessage.textContent = 'Passwords do not match.';
        resetMessage.className = 'auth-message error';
        return;
      }

      const users = getSavedUsers();
      let foundIndex = -1;

      for (let i = 0; i < users.length; i++) {
        const parts = users[i].split('|');
        const savedEmail = (parts[2] || '').toLowerCase();

        if (savedEmail === email.toLowerCase()) {
          foundIndex = i;
          break;
        }
      }

      if (foundIndex === -1) {
        resetMessage.textContent = 'No account was found for that email address.';
        resetMessage.className = 'auth-message error';
        return;
      }

      const parts = users[foundIndex].split('|');
      const savedUsername = parts[0] || '';
      const savedEmail = parts[2] || email;
      users[foundIndex] = [savedUsername, newPassword, savedEmail].join('|');
      saveUsers(users);

      resetMessage.textContent = 'Password reset successful! Redirecting to login...';
      resetMessage.className = 'auth-message success';
      resetForm.reset();

      setTimeout(function () {
        window.location.href = 'index.html';
      }, 900);
    });
  </script>
</body>
</html>
