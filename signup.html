<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="css/global.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <div class="auth-brand" role="banner" aria-label="CineVerse brand">CineVerse</div>

    <main class="auth-card wide">
      <section aria-labelledby="signupTitle">
        <header>
          <h1 id="signupTitle" class="auth-title">Sign Up</h1>
        </header>

        <form id="signupForm" class="auth-form" action="#" method="post">
          <fieldset>
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="signupUsername">Username</label>
            <input type="text" id="signupUsername" name="signupUsername" placeholder="Choose a username" required>

            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a password" required>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>

            <button type="submit">Create Account</button>
          </fieldset>
        </form>

        <div id="signupMessage" class="auth-message" aria-live="polite"></div>

        <div class="auth-footer">
          <a class="auth-link" href="Login.html">Already have an account? Login</a>
        </div>
      </section>
    </main>
  </div>

  <script src="js/global.js"></script>
  <script>
    const signupForm = document.getElementById('signupForm');
    const signupMessage = document.getElementById('signupMessage');

    signupForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('signupUsername').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (fullName.length < 2) {
        signupMessage.textContent = 'Full name must be at least 2 characters.';
        signupMessage.className = 'auth-message error';
        return;
      }

      if (!email || !email.includes('@')) {
        signupMessage.textContent = 'Please enter a valid email address.';
        signupMessage.className = 'auth-message error';
        return;
      }

      if (username.length < 3) {
        signupMessage.textContent = 'Username must be at least 3 characters.';
        signupMessage.className = 'auth-message error';
        return;
      }

      if (password.length < 6) {
        signupMessage.textContent = 'Password must be at least 6 characters.';
        signupMessage.className = 'auth-message error';
        return;
      }

      if (password !== confirmPassword) {
        signupMessage.textContent = 'Passwords do not match.';
        signupMessage.className = 'auth-message error';
        return;
      }

      const savedUsers = localStorage.getItem('cineverseUser') || '';
      const users = savedUsers ? savedUsers.split(';') : [];

      let usernameExists = false;
      let emailExists = false;

      for (let i = 0; i < users.length; i++) {
        const userData = users[i].split('|');
        const savedUsername = (userData[0] || '').toLowerCase();
        const savedEmail = (userData[2] || '').toLowerCase();

        if (savedUsername === username.toLowerCase()) {
          usernameExists = true;
          break;
        }

        if (savedEmail === email.toLowerCase()) {
          emailExists = true;
        }
      }

      if (usernameExists) {
        signupMessage.textContent = 'This username already exists. Please choose another one.';
        signupMessage.className = 'auth-message error';
        return;
      }

      if (emailExists) {
        signupMessage.textContent = 'This email is already registered. Please use another email.';
        signupMessage.className = 'auth-message error';
        return;
      }

      users.push(username + '|' + password + '|' + email);
      localStorage.setItem('cineverseUser', users.join(';'));

      signupMessage.textContent = 'Sign up successful! Redirecting to login...';
      signupMessage.className = 'auth-message success';

      setTimeout(function () {
        window.location.href = 'Login.html';
      }, 800);
    });
  </script>
</body>
</html>
